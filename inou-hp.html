<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>異能将棋 体力制</title>
<meta name="description" content="5×6盤で、駒の能力と体力を削り合う将棋。2人で1台を交互に使うか、コンピュータと対戦できます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&text=%E7%8E%89%E7%8E%8B%E9%A3%9B%E8%A7%92%E9%87%91%E9%8A%80%E6%AD%A9%E9%BE%8D%E9%A6%AC%E5%85%A8%E3%81%A8&display=swap">
<style>
/* レイアウト：スマホは「相手の札・盤・自分の札・駒の情報・記録」を縦に。広い画面は盤の列と情報の列の2列 */
:root {
  --bg: #eef0f4;
  --surface: #ffffff;
  --line: #d6d9e3;
  --ink: #191b26;
  --muted: #5b6074;
  --board: #e2c286;
  --board-line: #9c7536;
  --koma: #f4dfb1;
  --koma-edge: #b98d4c;
  --koma-ink: #241808;
  --prom: #b3261e;
  --p0: #1d6a86;
  --p1: #c0442c;
  --sun: #b46a00;
  --moon: #4f50c8;
  --star: #c02c4b;
  --hp: #2f9e5b;
  --hp-low: #d0453a;
  --sel: rgba(29, 106, 134, .30);
  --target: rgba(29, 106, 134, .55);
  --last: rgba(255, 220, 120, .55);
  --shade: rgba(20, 22, 32, .45);
  --fx-gold: #c98a00; --fx-prom: #9b3fd6; --fx-sp: #8a3ad0; --fx-ret: #1f86d0; --fx-dmg: #e0392b; --fx-heal: #1f9a55;
  --f-disp: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-koma: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111319; --surface: #1b1e28; --line: #2d3141; --ink: #e8eaf2; --muted: #9ea3b8;
    --board: #b8935a; --board-line: #6e4f22; --koma: #ecd29c; --koma-edge: #9b7339; --koma-ink: #21160a; --prom: #a3201a;
    --p0: #5bb8d6; --p1: #ff8a6e; --sun: #f0a63a; --moon: #9a9bff; --star: #ff7088;
    --hp: #45c27a; --hp-low: #ff6b5e; --sel: rgba(91, 184, 214, .35); --target: rgba(20, 60, 80, .55);
    --last: rgba(255, 220, 120, .45); --shade: rgba(0, 0, 0, .6);
    --fx-gold: #ffc23d; --fx-prom: #c88bff; --fx-sp: #c58bff; --fx-ret: #5cc0ff; --fx-dmg: #ff6b5e; --fx-heal: #45c27a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111319; --surface: #1b1e28; --line: #2d3141; --ink: #e8eaf2; --muted: #9ea3b8;
  --board: #b8935a; --board-line: #6e4f22; --koma: #ecd29c; --koma-edge: #9b7339; --koma-ink: #21160a; --prom: #a3201a;
  --p0: #5bb8d6; --p1: #ff8a6e; --sun: #f0a63a; --moon: #9a9bff; --star: #ff7088;
  --hp: #45c27a; --hp-low: #ff6b5e; --sel: rgba(91, 184, 214, .35); --target: rgba(20, 60, 80, .55);
  --last: rgba(255, 220, 120, .45); --shade: rgba(0, 0, 0, .6);
    --fx-gold: #ffc23d; --fx-prom: #c88bff; --fx-sp: #c58bff; --fx-ret: #5cc0ff; --fx-dmg: #ff6b5e; --fx-heal: #45c27a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.6 var(--f-body);
  -webkit-text-size-adjust: 100%;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
button { font: inherit; color: inherit; }
button:focus-visible, .cell:focus-visible { outline: 2px solid var(--p0); outline-offset: 2px; }
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
}
header.bar { display: flex; align-items: center; gap: 8px; padding-block: 10px 6px; }
header.bar h1 { font: 900 clamp(15px, 4.4vw, 19px)/1.2 var(--f-disp); margin: 0; flex: 1; min-width: 0; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 420px) { header.bar .btn { padding: 6px 8px; font-size: 12.5px; } }
header.bar h1 small { font: 500 12px var(--f-body); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 7px 11px; font-size: 13.5px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--p0); border-color: var(--p0); color: #fff; font-weight: 700; }

/* ---------- 対局の準備 ---------- */
.setup { padding-block: 6px 40px; display: grid; gap: 18px; }
.setup h2 { font: 700 15px/1.4 var(--f-disp); margin: 0 0 8px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 9px 14px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--p0); color: #fff; font-weight: 700; }
.opts { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.opts label { color: var(--muted); font-size: 13px; margin-right: 6px; }
.pick { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .pick { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pickcol h3 { font: 700 15px/1.4 var(--f-disp); margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.side { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; color: #fff; font-size: 13px; font-weight: 700; }
.side.s0 { background: var(--p0); } .side.s1 { background: var(--p1); }
.decks { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.deckbtn {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
  padding: 10px 11px; cursor: pointer; display: grid; gap: 2px; min-width: 0;
}
.deckbtn b { font: 700 15px/1.3 var(--f-disp); }
.deckbtn .ld { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.deckbtn .ds { font-size: 12.5px; line-height: 1.45; }
.deckbtn .at { display: inline-block; font-size: 11px; font-weight: 700; color: #fff; border-radius: 5px; padding: 0 6px; margin-right: 6px; }
.deckbtn[aria-pressed="true"] { border-color: var(--c); box-shadow: inset 0 0 0 2px var(--c); }
.start { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.start .btn.primary { padding: 12px 26px; font-size: 16px; }
.note { color: var(--muted); font-size: 12.5px; }

/* ---------- 対局 ---------- */
.play { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); padding-block: 2px 30px; align-items: start; }
@media (min-width: 880px) { .play { grid-template-columns: minmax(0, 500px) minmax(0, 1fr); } }
.boardcol { display: grid; gap: 8px; justify-items: center; min-width: 0; }
.panel {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 8px 10px; display: grid; gap: 5px; border-left: 4px solid var(--pc);
}
.panel.turn { box-shadow: 0 0 0 2px var(--pc), 0 0 18px color-mix(in srgb, var(--pc) 40%, transparent); }
.panel.turn.glow { animation: glow 2s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 2px var(--pc), 0 0 4px color-mix(in srgb, var(--pc) 20%, transparent); } }
.panel.hit { animation: hit .45s ease-out both; }
@keyframes hit { 15% { translate: -5px 0; } 35% { translate: 4px 0; } 55% { translate: -3px 0; } 75% { translate: 1px 0; } 100% { translate: 0 0; } }
.prow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pname { font: 700 14px/1.3 var(--f-disp); min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pname .lead { color: var(--muted); font: 500 12px var(--f-body); border: 0; background: none; padding: 0; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.turnflag { font-size: 12.5px; font-weight: 700; color: #fff; background: var(--pc); border-radius: 6px; padding: 2px 9px; white-space: nowrap; }
.hpline { display: flex; align-items: center; gap: 8px; position: relative; }
.hpbar { flex: 1; height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; position: relative; }
.hpbar i { display: block; height: 100%; background: var(--hp); border-radius: 6px; position: relative; }
.hpbar i.low { background: var(--hp-low); }
.hpbar .lag { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: color-mix(in srgb, var(--fx-dmg) 50%, transparent); }
.hpbar .lag.heal { background: color-mix(in srgb, var(--fx-heal) 50%, transparent); }
@keyframes barTo { from { width: var(--from); } to { width: var(--to); } }
@keyframes lagTo { 0%, 45% { width: var(--from); } 100% { width: var(--to); } }
.hpnum { font: 700 14px/1 var(--f-disp); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hpnum small { color: var(--muted); font-weight: 500; font-size: 11.5px; }
@keyframes fl { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 11.5px; line-height: 1.5; border-radius: 6px; padding: 0 6px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.on { color: #fff; background: var(--ac, var(--moon)); border-color: transparent; font-weight: 700; }
.chip.warn { color: #fff; background: var(--hp-low); border-color: transparent; font-weight: 700; }
.hand { display: flex; flex-wrap: wrap; gap: 4px; min-height: 34px; align-items: center; }
.hand .empty { color: var(--muted); font-size: 12px; }
.hpiece { border: 0; background: none; padding: 0; cursor: pointer; border-radius: 6px; }
.hpiece[aria-pressed="true"] { background: var(--sel); }

.boardwrap { width: min(100%, 470px, max(270px, calc((100dvh - 390px) * 0.80))); }
@media (min-width: 880px) { .boardwrap { width: min(100%, 470px, max(270px, calc((100dvh - 330px) * 0.80))); } }
.board.shake { animation: shake .5s ease-out both; }
@keyframes shake { 10% { translate: calc(var(--amp) * -1) 0; } 25% { translate: var(--amp) calc(var(--amp) * .4); } 40% { translate: calc(var(--amp) * -.7) 0; } 60% { translate: calc(var(--amp) * .4) 0; } 80% { translate: calc(var(--amp) * -.2) 0; } 100% { translate: 0 0; } }
.files, .board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) 18px; }
.files span, .ranks span { color: var(--muted); font-size: 11.5px; text-align: center; font-variant-numeric: tabular-nums; }
.board {
  background: var(--board); border: 2px solid var(--board-line); border-radius: 6px;
  grid-template-columns: repeat(5, minmax(0, 1fr)); position: relative;
}
.boardgrid { display: grid; grid-template-columns: minmax(0, 1fr) 18px; align-items: stretch; }
.ranks { display: grid; grid-template-rows: repeat(6, minmax(0, 1fr)); align-items: center; }
.cell {
  aspect-ratio: 1 / 1.1; border: 0; padding: 0; margin: 0; background: transparent; position: relative;
  border-right: 1px solid var(--board-line); border-bottom: 1px solid var(--board-line);
  display: grid; place-items: center; cursor: pointer; min-width: 0;
}
.cell:nth-child(5n) { border-right: 0; }
.cell:nth-last-child(-n+5) { border-bottom: 0; }
.cell.last { background: var(--last); }
.cell.sel { background: var(--sel); }
.cell.tgt::after { content: ""; position: absolute; width: 26%; height: 24%; border-radius: 50%; background: var(--target); }
.cell.tgt.cap::after { width: 86%; height: 84%; background: none; border: 3px solid var(--target); border-radius: 10px; }
.cell.tgt.ab::after { width: 86%; height: 84%; border-radius: 10px; border: 3px solid var(--abc); background: color-mix(in srgb, var(--abc) 16%, transparent); box-shadow: 0 0 10px color-mix(in srgb, var(--abc) 70%, transparent); }
.cell.tgt.ab.aT { --abc: var(--fx-gold); } .cell.tgt.ab.aN { --abc: var(--fx-prom); }
.cell.tgt.ab.aT.aN::after { box-shadow: inset 0 0 0 3px var(--fx-prom), 0 0 10px color-mix(in srgb, var(--fx-gold) 70%, transparent); }
.rmark { position: absolute; top: 3%; left: 4%; z-index: 2; font: 900 9.5px/1 var(--f-disp); color: #fff; border-radius: 4px; padding: 2px 3px; }
.rmark.S { background: #a2621a; } .rmark.A { background: #2f6fb3; } .rmark.B { background: #6b7285; }
.cell > .badges { top: 3%; right: 3%; }
.pulse { animation: pulse .9s ease-out both; }
@keyframes pulse { 0% { scale: 1; filter: none; } 30% { scale: 1.5; filter: brightness(1.5) drop-shadow(0 0 4px #fff); } 100% { scale: 1; filter: none; } }
.koma.arrive { animation: arrive .32s ease-out both; }
@keyframes arrive { 0% { scale: 1.22; } 100% { scale: 1; } }
.wedge { position: absolute; left: 4%; bottom: 4%; width: 30%; height: 30%; }
.wedge svg { width: 100%; height: 100%; display: block; }

.koma {
  width: 82%; aspect-ratio: 46 / 54; position: relative; display: grid; place-items: center;
  font: 800 clamp(17px, 6.3vw, 31px)/1 var(--f-koma); color: var(--koma-ink); padding-top: 12%;
}
.koma::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(170deg, var(--koma), color-mix(in srgb, var(--koma) 80%, var(--koma-edge)));
  clip-path: polygon(50% 0, 88% 16%, 100% 100%, 0 100%, 12% 16%);
}
.koma::after {
  content: ""; position: absolute; left: 4%; right: 4%; bottom: 0; height: 13%; background: var(--ac, transparent);
}
.koma > span { position: relative; z-index: 1; }
.koma.pr { color: var(--prom); }
.koma.up { transform: rotate(180deg); }
.koma.small { width: 30px; height: 35px; aspect-ratio: auto; font-size: 17px; }
.koma.mid { width: 44px; height: 52px; aspect-ratio: auto; font-size: 25px; }
.badges { position: absolute; top: 2%; right: 2%; display: flex; flex-direction: column; gap: 1px; z-index: 2; }
.badge { width: 15px; height: 15px; border-radius: 50%; display: grid; place-items: center; font: 700 9.5px/1 var(--f-body); color: #fff; }
.badge.mem { background: var(--sun); } .badge.stone { background: var(--moon); } .badge.kago { background: #2f9e5b; }
.hpiece .koma { width: 30px; height: 35px; aspect-ratio: auto; font-size: 17px; }
.hcount { font-size: 11px; color: var(--muted); }

.side2 { display: grid; gap: 12px; min-width: 0; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.box h2 { font: 700 14px/1.4 var(--f-disp); margin: 0 0 6px; color: var(--muted); }
.info { display: flex; gap: 12px; align-items: flex-start; }
.info .koma { flex: 0 0 auto; align-self: flex-start; }
.info .body { min-width: 0; flex: 1; }
.info h3 { font: 700 17px/1.35 var(--f-disp); margin: 0; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 4px; font-size: 12px; color: var(--muted); align-items: center; }
.rar { font: 900 11.5px/1 var(--f-disp); color: #fff; border-radius: 5px; padding: 3px 6px; }
.rar.B { background: #6b7285; } .rar.A { background: #2f6fb3; } .rar.S { background: #a2621a; }
.pill { border: 1px solid currentColor; border-radius: 999px; padding: 0 7px; font-weight: 700; font-size: 11.5px; }
.eff { margin: 6px 0 0; font-size: 14px; }
.eff b { color: var(--p0); }
.stat { font-size: 13px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat b { color: var(--ink); font-family: var(--f-disp); }
.log { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; max-height: 300px; overflow-y: auto; font-size: 13.5px; }
.logd summary { font: 700 14px/1.4 var(--f-disp); color: var(--muted); cursor: pointer; }
.logd summary span { font: 500 12px var(--f-body); margin-left: 6px; }
.istrip { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; min-height: 52px; }
.istrip .info { gap: 10px; }
.istrip .info h3 { font-size: 15px; }
.istrip .eff { font-size: 13px; margin-top: 3px; }
.istrip .stat { font-size: 12px; margin-top: 2px; }
.istrip .note { margin: 0; font-size: 12px; }
@media (min-width: 880px) { .istrip { display: none; } }
@media (max-width: 879px) { .side2 .infobox { display: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 13px; height: 13px; border: 2.5px solid var(--c); border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
.log li { padding: 4px 0; border-bottom: 1px dashed var(--line); }
.log li.mv { font-weight: 700; font-family: var(--f-disp); border-bottom: 0; padding-bottom: 0; }
.log li .m0 { color: var(--p0); } .log li .m1 { color: var(--p1); }
.log li.sub { padding-left: 1em; color: var(--muted); }
.log li.sub b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- ダイアログ ---------- */
.modal { position: fixed; inset: 0; background: var(--shade); display: grid; place-items: center; z-index: 20; padding: 16px; }
.dlg { background: var(--surface); border-radius: 16px; padding: 18px; width: min(100%, 440px); max-height: 86dvh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.dlg h2 { font: 900 19px/1.35 var(--f-disp); margin: 0 0 8px; }
.dlg p { margin: 0 0 10px; }
.dlg .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.dlg .acts .btn { flex: 1; padding: 11px; font-size: 15px; }
.dlg.rules { width: min(100%, 620px); }
.dlg.rules h3 { font: 700 15px var(--f-disp); margin: 14px 0 4px; }
.dlg.rules ul { margin: 0; padding-left: 1.2em; }
.dlg.rules li { margin: 2px 0; font-size: 14px; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translateX(-50%); background: var(--hp-low); color: #fff; font: 900 16px var(--f-disp); padding: 8px 18px; border-radius: 999px; z-index: 30; animation: fl 1.6s ease-out forwards; pointer-events: none; }
/* ---------- 演出（画面の上に重ねる層） ---------- */
#fx { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 15; pointer-events: none; }
#fx > * { position: absolute; pointer-events: none; }
.fxn { transform: translate(-50%, -50%); font: 900 22px/1 var(--f-disp); color: var(--c); white-space: nowrap; font-variant-numeric: tabular-nums;
  text-shadow: 0 0 3px var(--surface), 2px 0 0 var(--surface), -2px 0 0 var(--surface), 0 2px 0 var(--surface), 0 -2px 0 var(--surface); animation: fxn 1.3s ease-out both; }
.fxn small { font-size: .55em; margin-left: 2px; }
@keyframes fxn { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.18); } 24% { transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; transform: translate(-50%, -90%); } 100% { opacity: 0; transform: translate(-50%, -130%); } }
.fxn.low { animation-name: fxnLow; }
@keyframes fxnLow { 0% { opacity: 0; } 10%, 80% { opacity: 1; } 100% { opacity: 0; } }
.fxghost { display: grid; place-items: center; animation: ghost .55s ease-out both; }
@keyframes ghost { 0% { opacity: 1; filter: brightness(1); scale: 1; } 30% { opacity: 1; filter: brightness(2.4) drop-shadow(0 0 6px #fff); scale: 1.08; } 100% { opacity: 0; filter: brightness(2.4); scale: .45; } }
.cutin { display: grid; place-items: center; }
.cutin .band { width: 100%; text-align: center; color: #fff; padding: 9px 8px; background: linear-gradient(90deg, transparent, var(--c) 10%, var(--c) 90%, transparent);
  animation: cut 1s ease-out both; }
.cutin b { display: block; font: 900 clamp(18px, 5.6vw, 26px)/1.2 var(--f-disp); letter-spacing: .04em; text-shadow: 0 2px 6px rgba(0,0,0,.4); }
.cutin small { display: block; font: 700 12px/1.3 var(--f-body); opacity: .95; }

    <li>${MAXPLY}手に達したら、体力が多い方の勝ちです。</li></ul>
  <h3>盤と駒</h3><ul>
    <li>5×6の盤で、駒は1人10枚（玉・飛・角・金2・銀2・歩3）。動き方・持ち駒・二歩・打ち歩詰めは普通の将棋と同じです。</li>
    <li>相手側の奥2段に入ると成れます。</li>
    <li>取った駒は、自分の持ち駒では<b>素の駒</b>（能力なし）になります。元の持ち主が取り返すと、元のカードに戻ります。</li></ul>
  <h3>体力とダメージ</h3><ul>
    <li>10枚の駒の体力の合計が、プレイヤーの体力です。<b>先手は1.05倍</b>になります。</li>
    <li>相手の駒を取ると、<b>取った駒の攻撃力</b>のダメージを与えます（通常攻撃）。</li>
    <li>毎手番続けて取ると<b>連撃</b>で倍率が上がります：1.0 → 1.2 → 1.44 → 1.73 → 2.07。取らない手番があると戻ります。</li>
    <li>能力による<b>特殊ダメージ</b>（追撃など）は、攻撃力や連撃の影響を受けません。</li></ul>
  <h3>属性とカード</h3><ul>
    <li>日は体力が多く（×1.2）、星は攻撃力が高く（×1.3。体力は×0.95）、月はその間です。駒の下の色の帯が属性です（帯のない駒は素の駒）。</li>
    <li>能力が出るのは「取った時」「成った時」です。玉はリーダーで、いつも効く能力を持ちます。</li>
    <li>駒の左上の印はレア（S・A・B）です。右上の印：<b>記</b>＝記憶、<b>石</b>＝返し石、<b>護</b>＝加護。盤の稲妻は楔です。</li></ul>
  <h3>画面の見方</h3><ul>
    <li>駒を選ぶと、動けるマスに印が出ます。<b>金の枠</b>のマスに動くと、取った時の能力や指令が出ます。<b>紫の枠</b>は、成ると能力が出るマスです。</li>
    <li>ダメージの数字の色：<b>赤</b>＝通常攻撃、<b>紫</b>＝特殊ダメージ、<b>青</b>＝返し石で返したもの、<b>緑</b>＝回復。</li>
    <li>演出の多さは、デッキを選ぶ画面の「演出」で、ふつう・少なめ・なしから選べます。</li></ul>
  <h3>用語</h3><ul>
    <li>追撃 X：相手に X の特殊ダメージ。吸収 X：相手に X のダメージを与え、自分も X 回復。</li>
    <li>鼓舞 ×N：次の通常攻撃が N 倍。守り X：次に受ける通常攻撃を X 減らす。加護：この駒が盤上にいる間ずっと効く。</li></ul>
  <div class="acts"><button class="btn primary" id="rl-ok" type="button">閉じる</button></div>`, { 'rl-ok': () => {}, __dismiss: () => {} }, 'rules');
}
